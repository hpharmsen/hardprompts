models:
  # Effort variants: "model@level" runs the same model at a different reasoning depth.
  # The entry without a suffix stays the provider default, so it is the reference point.
  # Only add levels the provider supports natively; justai silently downmaps the rest, which
  # would cost a full run to reproduce a result you already have.

  # gpt-4.1
  # gpt-4o-mini
  # gpt-5.2-pro VEEL TE DUUR
  # gpt-5.4-mini   idem, luna is goedkoper: $0.2/$1.2 tegen $0.75/$4.5
  # gpt-5.4-nano   vervangen door gpt-5.6-luna, zelfde prijs en 48/48 tegen 24/48
  # gpt-5.6-luna   vervangen door gpt-6-luna, half zo duur: $0.1/$0.5 tegen $0.2/$1.2
  # gpt-5.6-sol    vervangen door gpt-6-sol, zelfde prijs $2/$10
  - gpt-5.6-terra
  - gpt-5.6-terra@high
  - gpt-5.6-terra@low
  - gpt-5.6-terra@max        # OpenAI's SDK caps at xhigh, so justai maps max down and warns
  - gpt-6-astra          # $10/$50 per M tokens, dus duur. gpt-6-astra-pro kost hetzelfde maar staat er niet bij
  - gpt-6-luna           # $0.1/$0.5. OpenAI noemt dit een permanente prijs, geen introkorting
  - gpt-6-sol            # $2/$10. gpt-6-sol-pro kost hetzelfde maar staat er niet bij, net als bij astra
  # o3-mini

  # claude-fable-5    vervangen door claude-fable-5-1, zelfde prijs. Varianten idem verhuisd
  # claude-fable-5-1  Verwijderd. Te duur.
  # claude-fable-5-1@high  # Verwijderd. Te duur.
  # claude-fable-5-1@low  # Verwijderd. Te duur.
  # claude-fable-5-1@max  # Verwijderd. Te duur.
  - claude-haiku-4-5
  # claude-opus-4-7   vervangen door claude-opus-5, zelfde prijs
  # claude-opus-4-8   idem, zelfde prijs. Effort-varianten verhuisd naar opus-5
  # claude-opus-5     vervangen door claude-opus-5-5, goedkoper: $4/$20 tegen $5/$25. Varianten verhuisd
  - claude-opus-5-5
  - claude-opus-5-5@high
  - claude-opus-5-5@low
  - claude-opus-5-5@max      # Opus 5.5 doet low, medium, high en max native, met medium als default
  # claude-opus-5@high   idem
  # claude-opus-5@low    varianten verhuisd naar opus-5-5, net als eerder van 4-8 naar 5
  # claude-opus-5@max    idem
  - claude-sonnet-5

  - gemini-2.5-flash-lite
  - gemini-3.1-flash-lite
  - gemini-3.1-pro-preview
  - gemini-3.1-pro-preview@high   # Gemini 3 stops at high; xhigh and max are the same run
