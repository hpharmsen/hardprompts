  # Effort variants: "model@level" runs the same model at a different reasoning depth.
  # The entry without a suffix above stays the provider default, so it is the reference point.
  # Only add levels the provider supports natively; justai silently downmaps the rest, which
  # would cost a full run to reproduce a result you already have.
  - claude-fable-5-1@low
  - claude-fable-5-1@high
  - claude-fable-5-1@max
  - claude-opus-5@low
  - claude-opus-5@high
  - claude-opus-5@max
  - gpt-5.6-terra@low
  - gpt-5.6-terra@high
  - gpt-5.6-terra@max        # OpenAI's SDK caps at xhigh, so justai maps max down and warns
  - gemini-3.1-pro-preview@low
  - gemini-3.1-pro-preview@medium
  - gemini-3.1-pro-preview@high   # Gemini 3 stops at high; xhigh and max are the same run
