<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardprompts - Model Benchmark Visualisatie</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }
        h2 {
            margin-bottom: 16px;
            color: #fff;
        }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
        }
        .tab {
            padding: 12px 24px;
            background: #2a2a4a;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            border-radius: 8px 8px 0 0;
            transition: all 0.2s;
        }
        .tab:hover {
            background: #3a3a5a;
            color: #fff;
        }
        .tab.active {
            background: #4a4a7a;
            color: #fff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: center;
            min-width: 90px;
        }
        th {
            background: #2a2a4a;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        th.model-header {
            position: sticky;
            left: 0;
            z-index: 20;
            background: #3a3a5a;
        }
        th.score-header {
            background: #3a4a5a;
        }
        td.model-cell {
            position: sticky;
            left: 0;
            background: #2a2a4a;
            font-weight: bold;
            text-align: left;
            white-space: nowrap;
            z-index: 5;
        }
        td.model-cell a {
            color: #6ea8fe;
            text-decoration: none;
        }
        td.model-cell a:hover {
            text-decoration: underline;
        }
        td.score-cell {
            background: #2a3a4a;
            font-weight: bold;
        }
        .score-pct {
            font-size: 16px;
        }
        .score-fraction {
            font-size: 11px;
            color: #AAA;
            margin-top: 2px;
        }
        .result-cell {
            position: relative;
            min-height: 40px;
        }
        .result-main {
            font-size: 18px;
            font-weight: bold;
        }
        .result-pass { color: #4caf50; }
        .result-fail { color: #f44336; }
        .result-partial { color: #ff9800; }
        .result-error { color: #9e9e9e; }
        .result-count {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: #666;
        }
        .result-time {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            color: #666;
        }
        .chart-container {
            background: #2a2a4a;
            border-radius: 12px;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        canvas {
            max-height: 600px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 16px;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .result-legend {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            justify-content: center;
            font-size: 12px;
        }
        .result-legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .vision-toggle {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 16px;
        }
        .vision-toggle:hover {
            color: #fff;
        }
        .vision-toggle input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }
        /* Model Card Styles */
        .model-card {
            max-width: 900px;
            margin: 0 auto;
        }
        .model-card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        .back-btn {
            background: #3a3a5a;
            border: none;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .back-btn:hover {
            background: #4a4a6a;
            color: #fff;
        }
        .model-card-title {
            font-size: 24px;
            color: #fff;
        }
        .model-card-lab {
            color: #888;
            font-size: 14px;
        }
        .card-section {
            background: #2a2a4a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-section h3 {
            margin-bottom: 16px;
            color: #aaa;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .spec-item {
            background: #1a1a2e;
            padding: 16px;
            border-radius: 8px;
        }
        .spec-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .spec-value {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        .results-table {
            width: 100%;
        }
        .results-table th {
            text-align: left;
            padding: 12px;
            background: #1a1a2e;
        }
        .results-table td {
            padding: 12px;
            border-bottom: 1px solid #333;
        }
    </style>
</head>
<body>
    <h1>Hardprompts Benchmark Resultaten</h1>

    <div class="tabs">
        <button class="tab active" onclick="showTab('table')">Tabel</button>
        <button class="tab" onclick="showTab('speed')">Score vs Snelheid</button>
        <button class="tab" onclick="showTab('price')">Score vs Prijs</button>
        <label class="vision-toggle">
            <input type="checkbox" id="include-vision" checked onchange="onVisionToggle()">
            <span>Include vision</span>
        </label>
    </div>

    <div id="table" class="tab-content active">
        <div class="result-legend">
            <span><strong class="result-pass">&#10003;</strong> = Correct</span>
            <span><strong class="result-fail">X</strong> = Fout</span>
            <span><strong class="result-partial">3</strong> = Deels correct</span>
            <span><strong class="result-error">T/R/B/E/G/I/N</strong> = Timeout/Rate limit/Bad request/Error/General error/Import/Not implemented</span>
        </div>
        <div class="table-container">
            <div class="loading" id="table-loading">Data laden...</div>
            <table id="results-table" style="display: none;"></table>
        </div>
    </div>

    <div id="speed" class="tab-content">
        <div class="chart-container">
            <canvas id="speed-chart"></canvas>
            <div class="legend" id="speed-legend"></div>
        </div>
    </div>

    <div id="price" class="tab-content">
        <div class="chart-container">
            <canvas id="price-chart"></canvas>
            <div class="legend" id="price-legend"></div>
        </div>
    </div>

    <div id="model-card" class="tab-content">
        <div class="model-card" id="model-card-content"></div>
    </div>

    <script>
        let resultsData = [];
        let modelsData = {};
        let aggregatedData = {};
        let speedChart = null;
        let priceChart = null;
        let includeVision = true;
        let currentModelKey = null;

        const VISION_TESTS = ['BALKON1', 'TERRAS2', 'TERRAS3', 'VERSCHILLEN1', 'VERSCHILLEN2'];
        let testOrder = [];
        let testMaxScores = {};
        let modelOrder = [];

        // Embedded data (will be filled by output.py for standalone use)
        const EMBEDDED_DATA = {
            prompts: "[STRAWBERRY]\njson = true\nprompt = \"\"\"how many \u201cr\u201ds are in the word \u201cstrawberry. Give the output as json with key: \u201ccount\u201d and a number\"\"\"\nanswer = {count = 3}\n\n[BEOORDELAAR]\njson = false\nanswer_contains = 'boven de zuiger'\nsystem = \"\"\"Je bent een ervaren leraar autotechniek. Je doel is om mij zo goed en zo effici\u00ebnt mogelijk {subject} bij te brengen.\nIk volg een studie autotechniek op MBO of community college niveau.\nJe bent vriendelijk, behulpzaam. Je schrijft in het Nederlands.\"\"\"\nprompt = \"\"\"Ik wil dat je mijn antwoord in een examen beoordeelt.\nBeschouw de volgende vraag en het antwoord van een expert, beiden tussen triple quotes:\n\nVraag: '''Wat laat het indicateurdiagram zien?'''\nExpert antwoord: '''Het drukverloop boven de zuiger tijdens \u00e9\u00e9n arbeidscyclus.'''\n\nVolg de volgende stappen:\n\n1. Beschouw mijn antwoord: '''De druk in de zuiger.'''\nen mijn correctie: '''tijdens een cyclus van de motor'''\nGeef hier geen output over.\n\n2. Voeg mijn antwoord en mijn correctie samen tot \u00e9\u00e9n antwoord.\nWaar correctie en antwoord elkaar tegen spreken, kies je voor de correctie.\nGeef hier geen output over.\n\n3. Beoordeel dit samengevoegde antwoord door het te vergelijken met het antwoord van de expert.\nGeef in je beoordeling aan waar ik kennis mis en leg uit hoe ik deze hiaten kan minimaliseren met behulp van voorbeelden uit de echte wereld.\nGeef deze beoordeling als output.\nMaak je tekst leerzaam, motiverend en inspirerend maar gebruik eenvoudige taal.\nGebruik maximaal 80 woorden.\nAntwoord in het Nederlands.\"\"\"\n\n\n[VERTALER]\njson = false\nanswer_contains = '%naam%'\nsystem = \"\"\"Je bent een vertaler. Je vertaalt software die bedoeld is voor de training van automonteurs.\nDe vertalingen bestaan soms uit hele zinnen maar soms ook uit losse woorden.\"\"\"\nprompt = \"\"\"Vertaal de volgende 3 teksten naar Engels.\n\n1 [[De eerste zin bestaat@@uit twee regels en nog een lege regel aan het eind@@]]\n2 [[We luisterden naar de band maar hoorden er geen lucht uit lopen.]]\n3 [[@@Hallo %naam%. Je hebt %aantal% nieuwe berichten.]]\n\n**Belangrijke instructies voor de vertaling:**\n\n- **Alleen tekst vertalen:** Vertaal enkel de tekst die zich bevindt tussen de dubbele vierkante haakjes `[[` en `]]`.\n- **Behoud van speciale tekens:** Alle spaties, tabs, leestekens, `@@`, `###`, symbolen, en andere speciale tekens moeten exact behouden blijven zoals ze in de oorspronkelijke tekst staan.\n- **Formatteerkenmerken behouden:** Als een tekst eindigt op `@@`, de vertaalde tekst moet ook eindigen op `@@`.\n\n**Vertaalverzoek:**\n\nGeef de vertalingen terug met behoud van de originele structuur, nummering, en formatteerkenmerken.\"\"\"\n\n[MULTI_VERTALER]\njson = true\nsystem = \"\"\"You are a professional translator specialized in translating technical training PowerPointdocuments.\n\n## Target audience\nThe texts requiring translation are technical training materials specifically designed for sweepers.\n\nThese training documents delve into a variety of intricate topics, including hydraulic systems and\nelectrical systems, which are essential for the operation and control of the sweepers.\n\nThe training is meticulously structured to cater to mechanics at different levels of expertise,\nfrom beginners who are just starting their careers to seasoned professionals who have extensive experience in the field.\n\nEach section of the training is tailored to enhance the understanding and skills of the mechanics,\nproviding them with the necessary knowledge to perform maintenance, troubleshoot issues,\nand optimize the performance of the sweepers.\n\nThe goal of these trainings is to equip the mechanics with a thorough understanding of the technical aspects of sweepers,\nenabling them to handle various challenges and improve the overall efficiency and reliability of the machines.\"\"\"\nprompt = \"\"\"Translate this JSON list with 70 texts into Dutch.\n\n[[0, \"How to make the RAVO R5e safe to work on.\"], [1, \"How to apply the Factory Standard guidelines.\"], [2, \"When you should use personal protection equipment.\"], [3, \"How to disable the high voltage system safely in accordance \"], [4, \"     with the \"], [5, \"13-step\"], [6, \" procedure.\"], [7, \"Goals for this training\"], [8, \"Autosized\"], [9, \"The most important is \"], [10, \"that\"], [11, \"participants\"], [12, \" feel \"], [13, \"confident\"], [14, \"that\"], [15, \"they\"], [16, \"can\"], [17, \"safely\"], [18, \" handel \"], [19, \"the\"], [20, \"electric\"], [21, \" machine \"], [22, \"and\"], [23, \"the\"], [24, \"safety\"], [25, \" procedure. \"], [26, \"Goals for this training\"], [27, \"According to the Factory Standard there are 3 kinds of technical levels:\"], [28, \"Level 1    Non-EV trained technician (Layman)\"], [29, \"Level 3   EV-Workshop Supervisor (main responsible person) (\"], [30, \"ev\"], [31, \"-WS) \"], [32, \"  At least EV-PP skilled\"], [33, \"Level 2   EV-Professional Person (\"], [34, \"ev\"], [35, \"-PP)\"], [36, \"The designation documents:\"], [37, \"There must be a \"], [38, \"written agreement \"], [39, \"between employer and employee.\"], [40, \"The person designating must be satisfied that:\"], [41, \"The person being designated \"], [42, \"meets the conditions\"], [43, \"The person designated must be satisfied that:\"], [44, \"He/she \"], [45, \"meets the conditions\"], [46, \" and that he/she has the \"], [47, \"necessary powers and resources\"], [48, \".\"], [49, \"The document must at least contain:\"], [50, \"The person\\u2019s name, effective and expiring date, qualification and vehicle type.\"], [51, \"Factory standard\"], [52, \"You must be authorized to work on electric vehicles in accordance with the local standards.\"], [53, \"The definition of the levels may differ depending on the standard of each country.\"], [54, \"There\"], [55, \" is no \"], [56, \"diffrence\"], [57, \"between\"], [58, \"Lvel\"], [59, \" 2 \"], [60, \"and\"], [61, \" 3 \"], [62, \"only\"], [63, \"that\"], [64, \" level 3 has \"], [65, \"the\"], [66, \"responsibilities\"], [67, \". \"], [68, \"Factory standard\"], [69, \"HV-system \"]]\n\nIf there are spaces or punctuation marks in the text, keep them intact in the translated text.\nTranslate all 70 texts.\n\nIf possible, try not to make the translations longer than the original texts.\nYour output should be JSON again, with the key 'translations' and the value being the list in the same structure as the input.\nNote! The output JSON must also contain exactly 70 elements.\"\"\"\nanswer_contains = \"verantwoordelijkheden\"\n\n[BIRMEES]\njson = false\nanswer_contains = \"\u1019\u102e\u1038\"\nprompt = \"\"\"Vertaal de volgende tekst naar het Birmees: Een zuigmotor vereist regelmatig onderhoud om optimale prestaties en een lange levensduur te garanderen. Het begint met het controleren en vervangen van smeerolie, omdat olie niet alleen wrijving vermindert maar ook vuildeeltjes afvoert en de interne componenten koelt. Het olie- en oliefilter dienen doorgaans om de 10.000 tot 15.000 kilometer vervangen te worden, afhankelijk van gebruiksomstandigheden en fabrikantenspecificaties. Daarnaast is het controleren en reinigen of vervangen van het luchtfilter belangrijk; een verstopt filter vermindert de luchttoevoer, wat leidt tot onvolledige verbranding en vermogensverlies. Ook de bougies moeten op tijd worden nagezien, omdat versleten bougies een onregelmatige ontsteking en verhoogd brandstofverbruik veroorzaken.\nVerder is het van belang de koelvloeistof op peil te houden en periodiek te verversen, aangezien oververhitting ernstige motorschade kan veroorzaken. De aandrijfriemen en kettingen moeten regelmatig op slijtage of spanning worden gecontroleerd, omdat deze een cruciale rol spelen in de timing en aandrijving van hulpaggregaten. Brandstoffilters dienen schoon te zijn om verstoppingen en schade aan de injectoren te voorkomen. Tot slot kan preventief onderhoud, zoals het meten van de compressiedruk en het inspecteren van de cilinderwanden op slijtage, helpen om beginnende problemen vroegtijdig te signaleren. Zo blijft een zuigmotor betrouwbaar, effici\u00ebnt en veilig in gebruik.\"\"\"\n\n[HAZES]\nprompt = \"\"\"Geef me de naam van de Amsterdamse volkszanger uit de Pijp wiens kinderen ook zangers zijn.\"\"\"\nanswer_contains = 'Andr\u00e9 Hazes'\njson = false\n\n[APPLES]\njson = true\nanswer = {oplossing = 11}\nprompt = \"\"\"Ik had een aantal appels. Ik verloor er \u00e9\u00e9n. Daarna gaf ik de helft van wat ik over had weg.\nDaarna at ik er drie op. Toen had ik er nog twee over. Hoeveel appels had ik aan het begin?\n\nWerk stap voor stap aan dit probleem.\nGeef me de output als json met als key: \"oplossing\" en als waarde het aantal appels.\nMaar geef alleen json als output terug. Geen andere tekst ervoor of erna.\"\"\"\n\n[LOGIQUIZ]\nprompt = \"\"\"Amanda, Jack, Mike en Rachel reisden in vier verschillende jaren (2015, 2016, 2017 en 2018) naar vier verschillende locaties (Londen, Rio de Janeiro, Sydney, Tokio).\n\t1.\tNoch Amanda noch Jack reisden in 2015.\n\t2.\tMike reisde niet naar Zuid-Amerika.\n\t3.\tMike reisde in 2017.\n\t4.\tAmanda bezocht Londen.\n\t5.\tNoch Mike noch Rachel reisden naar Japan.\n\t6.\tEen man reisde in 2016.\nWelke stad werd als eerste bezocht en door wie??\nGeef je antwoord als json met als keys:\n\"bestemming\": de stad die als eerste bezocht werd\n\"persoon\": de naam van de persoon die die stad bezocht.\"\"\"\njson = true\nanswer = {bestemming = \"Rio de Janeiro\", persoon = \"Rachel\"}\n\n[BALKON1]\nprompt = \"\"\"Geef me de oppervlakte van het balkon in vierkante meter. Geef je antwoord in json met als\nkey: 'oppervlakte' en als waarde de oppervlakte in vierkante meter afgerond op 2 cijfers achter de komma.\"\"\"\nimage = 'input/balkon1.png'\njson = true\nanswer = {oppervlakte = 6.84}\n\n[TERRAS2]\nprompt = \"\"\"Geef me de oppervlakte van het dakterras in vierkante meter. Geef je antwoord in json met als\nkey: 'oppervlakte' en als waarde de oppervlakte in vierkante meter afgerond op 4 cijfers achter de komma.\"\"\"\nimage = 'input/terras2.png'\njson = true\nanswer = {oppervlakte = 3.7275}\n\n[TERRAS3]\nprompt = \"\"\"Geef me de oppervlakte van het dakterras in vierkante meter. Geef je antwoord in json met als\nkey: 'oppervlakte' en als waarde de oppervlakte in vierkante meter afgerond op 4 cijfers achter de komma.\"\"\"\nimage = 'input/terras3.png'\njson = true\nanswer = {oppervlakte = 3.7275}\n\n[VERSCHILLEN1]\nmax_score = 12\nprompt = \"\"\"Kijk goed naar deze twee afbeeldingen en geef me de 12 verschillen.\nGeef niet meteen antwoord maar bekijk elke regio van de afbeelding zorgvuldig. Bekijk per regio welke verschillen je ziet.\nAls je de verschillen hebt gevonden, check ze dan. Zijn de afbeeldingen op dat punt echt verschillend?\nCheck tenslotte of je nog verschillen hebt gemist. Ik wil ze alle 12 hebben! Dat is heel belangrijk.\nStel geen vragen.\n\"\"\"\nimage = ['input/verschillen1a.png', 'input/verschillen1b.png']\nfollow_up_prompt = \"\"\"Een proefpersoon is gevraagd om de verschillen te vinden tussen twee afbeeldingen.\nDe proefpersoon komt met het volgende antwoord:\n\n<antwoord>\n{antwoord}\n</antwoord}\n\nHet juiste antwoord is:\n1. In de tweede afbeelding  mist een plank aan de linkerkant van het hek.\n2. In de tweede afbeelding mist het zadel van het paard.\n3. In tweede afbeelding heeft het paard een witte bles over de neus maar in de eerste afbeelding niet.\n4. In de eerste afbeelding heeft de kat haar achterpoot naar beneden hangen maar in de tweede afbeelding is die omhoog getrokken.\n5. In de eerste afbeelding is de trui van de man meer omhoog getrokken zodat je zijn heup ziet.\n6. In de eerste afbeelding heeft de man een haarlok door zijn pet steken en in de tweede afbeelding mist die.\n7. In de tweede afbeelding komt er een kuikentje uit een van de eieren.\n8. In de eerste afbeelding heeft de koe een bruin haarstukje tussen haar hoorns, in de tweede afbelding mist dat.\n9. In de tweede afbeelding mist de sluitmond van de gieter.\n10. In de tweee afbeelding staat er een extra kuikenje naast de gieter.\n11. In de eerste afbeelding staat het tweede kuikentje van links met zijn snavel naar links. In de tweede afbeelding is deze omgedraaid.\n12. In de tweede afbeelding heeft de koe een witte vlek aan haar zijkant, in de eerste afbeelding niet. Ofwel: in de eerste afbeelding loopt de zwarte vlek verder door.\n\nGeef aan welke van deze twaalf antwoorden de proefpersoon goed had gevonden (true) of niet had gevonden (false) en geef me ook het aantal goede antwoorden.\nGeef je antwoord in json in het volgende formaat:\n{'antwoorden': [true, true, false, false, true, true, true true, false, false, false, true],\n 'aantal_goed': 3}\"\"\"\n\n\n[VERSCHILLEN2]\nmax_score = 6\nprompt = \"\"\"Kijk goed naar deze twee afbeeldingen en geef me de verschillen.\nGeef niet meteen antwoord maar bekijk elke regio van de afbeelding zorgvuldig. Bekijk per regio welke verschillen je ziet.\nAls je de verschillen hebt gevonden, check ze dan. Zijn de afbeeldingen op dat punt echt verschillend?\nCheck tenslote of je nog verschillen hebt gemist. Ik wil ze zes hebben! Dat is heel belangrijk.\nStel geen vragen.\"\"\"\nimage = ['input/verschillen2a.png', 'input/verschillen2b.png']\nfollow_up_prompt = \"\"\"Een proefpersoon is gevraagd om de 6 verschillen te vinden tussen twee afbeeldingen.\nDe proefpersoon komt met het volgende antwoord:\n\n<antwoord>\n{antwoord}\n</antwoord}\n\nHet juiste antwoord is:\n1. In de tweede afbeelding mist de ring om haar wijsvinger.\n2. In de eerste afbeelding is haar riem bruin; in de tweede is deze blauw.\n3. In de tweede afbeelding is de ketting om haar hals verdwenen.\n4. Ook veranderde haar rechtse oog in een magisch paars oog.\n5. Aan haar linkse wimper verdween er een klein stukje.\n6. Het linkse oor is weg in afbeelding 2.\n\nGeef aan welke van deze zes antwoorden de proefpersoon goed had gevonden (true) of niet had gevonden (false) en geef me ook het aantal goede antwoorden.\nGeef je antwoord in json in het volgende formaat:\n{'antwoorden': [true, true, false, false, true, true],\n 'aantal_goed': 3}\"\"\"\n\n[WORDLE]\nprompt = \"\"\"Welk Engels woord moet dit zijn?\nGeef je antwoord in hoofdletters in json dict met key 'word'.\"\"\"\nimage = 'input/wordle.webp'\njson = true\nanswer = {word = 'BUTTE'}",

                if (agg) {
                    const testMax = testMaxScores[test] || 1;
                    maxScore += agg.count * testMax;
                    let testScore = 0;
                    agg.results.forEach(r => {
                        if (r === '√') { score += testMax; testScore += testMax; }
                        else if (/^\d+$/.test(r)) { score += parseInt(r); testScore += parseInt(r); }
                    });
                    if (agg.avgDuration !== null) {
                        totalDuration += agg.avgDuration * agg.durations.length;
                        durationCount += agg.durations.length;
                    }
                    testResults.push({
                        name: test,
                        result: agg.displayResult,
                        count: agg.count,
                        avgDuration: agg.avgDuration,
                        score: testScore
                    });
                }
            });

            const avgDuration = durationCount > 0 ? totalDuration / durationCount : null;

        async function loadData() {
            try {
                let promptsText, modelsYamlText, resultsText, modelsText;

                // Check if we have embedded data (for file:// protocol)
                if (EMBEDDED_DATA.prompts && EMBEDDED_DATA.results) {
                    promptsText = EMBEDDED_DATA.prompts;
                    modelsYamlText = EMBEDDED_DATA.models_yaml;
                    resultsText = EMBEDDED_DATA.results;
                    modelsText = EMBEDDED_DATA.models;
                } else {
                    // Fetch data from files (for http:// protocol)
                    const promptsResponse = await fetch('data/prompts.toml');
                    promptsText = await promptsResponse.text();

                    const modelsYamlResponse = await fetch('data/models.yaml');
                    modelsYamlText = await modelsYamlResponse.text();

                    const resultsResponse = await fetch('data/results.jsonl');
                    resultsText = await resultsResponse.text();

                    const modelsResponse = await fetch('data/models.jsonl');
                    modelsText = await modelsResponse.text();
                }

                // Extract section names [NAME] in order
                testOrder = [...promptsText.matchAll(/^\[([A-Z0-9_]+)\]/gm)].map(m => m[1]);

                // Extract max_score per test section (defaults to 1)
                testMaxScores = {};
                const sectionMatches = [...promptsText.matchAll(/^\[([A-Z0-9_]+)\]/gm)];
                for (let i = 0; i < sectionMatches.length; i++) {
                    const start = sectionMatches[i].index + sectionMatches[i][0].length;
                    const end = i + 1 < sectionMatches.length ? sectionMatches[i + 1].index : promptsText.length;
                    const body = promptsText.slice(start, end);
                    const maxMatch = body.match(/^max_score\s*=\s*(\d+)/m);
                    if (maxMatch) testMaxScores[sectionMatches[i][1]] = parseInt(maxMatch[1]);
                }

                // Extract model names (lines starting with "  - " that are not comments)
                modelOrder = [...modelsYamlText.matchAll(/^\s+-\s+([^#\n]+)/gm)]
                    .map(m => m[1].trim())
                    .filter(m => m);

                resultsData = resultsText.trim().split('\n')
                    .filter(line => line.trim())
                    .map(line => JSON.parse(line));

                modelsText.trim().split('\n')
                    .filter(line => line.trim())
                    .map(line => JSON.parse(line))
                    .forEach(m => modelsData[m.key] = m);

                processData();
                renderTable();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('table-loading').textContent = 'Fout bij laden: ' + error.message;
            }
        }

        function processData() {
            aggregatedData = {};

            resultsData.forEach(r => {
                const key = `${r.model}|${r.test_name}`;
                if (!aggregatedData[key]) {
                    aggregatedData[key] = {
                        model: r.model,
                        test_name: r.test_name,
                        results: [],
                        durations: []
                    };
                }
                aggregatedData[key].results.push(r.result);
                if (r.duration) aggregatedData[key].durations.push(r.duration);
            });

            Object.values(aggregatedData).forEach(agg => {
                const allSame = agg.results.every(r => r === agg.results[0]);
                if (allSame) {
                    agg.displayResult = agg.results[0];
                } else {
                    let score = 0;
                    agg.results.forEach(r => {
                        if (r === '√') score++;
                        else if (/^\d+$/.test(r)) score += parseInt(r);
                    });
                    const avg = score / agg.results.length;
                    agg.displayResult = avg % 1 === 0 ? String(avg) : avg.toFixed(1);
                }

                agg.count = agg.results.length;
                agg.avgDuration = agg.durations.length > 0
                    ? agg.durations.reduce((a, b) => a + b, 0) / agg.durations.length
                    : null;
            });
        }

        function renderTable() {
            const allModels = [...new Set(resultsData.map(r => r.model))];
            const tests = getFilteredTests();

            // Only include models that are in models.yaml, sorted by their order
            const models = modelOrder.filter(m => allModels.includes(m));

            const modelScores = {};
            models.forEach(model => {
                let score = 0, maxScore = 0;
                tests.forEach(test => {
                    const key = `${model}|${test}`;
                    const agg = aggregatedData[key];
                    if (agg) {
                        const testMax = testMaxScores[test] || 1;
                        maxScore += agg.count * testMax;
                        agg.results.forEach(r => {
                            if (r === '√') score += testMax;
                            else if (/^\d+$/.test(r)) score += parseInt(r);
                        });
                    }
                });
                modelScores[model] = { score, maxScore };
            });

            let html = '<thead><tr>';
            html += '<th class="model-header">Model</th>';
            html += '<th class="score-header">Score</th>';
            tests.forEach(test => {
                html += `<th>${test}</th>`;
            });
            html += '</tr></thead><tbody>';

            models.forEach(model => {
                html += '<tr>';
                const modelInfo = modelsData[model];
                const titleName = modelInfo ? modelInfo.name : model;
                html += `<td class="model-cell"><a href="#" onclick="showModelCard('${model}'); return false;" title="${titleName}">${model}</a></td>`;

                const { score, maxScore } = modelScores[model];
                const pct = maxScore > 0 ? Math.round(100 * score / maxScore) : 0;
                html += `<td class="score-cell">
                    <div class="score-pct">${pct}%</div>
                    <div class="score-fraction">${score}/${maxScore}</div>
                </td>`;

                tests.forEach(test => {
                    const key = `${model}|${test}`;
                    const agg = aggregatedData[key];

                    if (!agg) {
                        html += '<td class="result-cell">-</td>';
                        return;
                    }

                    let resultClass = 'result-error';
                    let displayText = agg.displayResult;

                    if (agg.displayResult === '√') {
                        resultClass = 'result-pass';
                        displayText = '&#10003;';
                    } else if (agg.displayResult === 'X') {
                        resultClass = 'result-fail';
                    } else if (/^\d+(\.\d+)?$/.test(agg.displayResult)) {
                        const num = parseFloat(agg.displayResult);
                        if (num > 0) {
                            resultClass = 'result-partial';
                        } else {
                            resultClass = 'result-fail';
                        }
                    }

                    const timeStr = agg.avgDuration !== null ? Math.round(agg.avgDuration) + 's' : '-';

                    html += `<td class="result-cell">
                        <span class="result-count">${agg.count}x</span>
                        <span class="result-main ${resultClass}">${displayText}</span>
                        <span class="result-time">${timeStr}</span>
                    </td>`;
                });

                html += '</tr>';
            });

            html += '</tbody>';

            document.getElementById('results-table').innerHTML = html;
            document.getElementById('results-table').style.display = 'table';
            document.getElementById('table-loading').style.display = 'none';
        }

        function getModelStats() {
            const allModels = [...new Set(resultsData.map(r => r.model))];
            // Only include models that are in models.yaml
            const models = modelOrder.filter(m => allModels.includes(m));
            const tests = getFilteredTests();

            return models.map(model => {
                let score = 0, maxScore = 0, totalDuration = 0, durationCount = 0;

                tests.forEach(test => {
                    const key = `${model}|${test}`;
                    const agg = aggregatedData[key];
                    if (agg) {
                        const testMax = testMaxScores[test] || 1;
                        maxScore += agg.count * testMax;
                        agg.results.forEach(r => {
                            if (r === '√') score += testMax;
                            else if (/^\d+$/.test(r)) score += parseInt(r);
                        });
                        if (agg.avgDuration !== null) {
                            totalDuration += agg.avgDuration * agg.durations.length;
                            durationCount += agg.durations.length;
                        }
                    }
                });

                const modelInfo = modelsData[model] || {};
                const avgDuration = durationCount > 0 ? totalDuration / durationCount : null;
                const scorePct = maxScore > 0 ? (score / maxScore) * 100 : 0;

                return {
                    model,
                    name: model,
                    lab: modelInfo.lab || 'default',
                    score,
                    maxScore,
                    scorePct,
                    avgDuration,
                    outputPrice: modelInfo.output_price
                };
            }).filter(m => m.maxScore > 0);
        }

        function createSpeedChart() {
            const stats = getModelStats().filter(m => m.avgDuration !== null);
            const datasets = [];
            const labs = [...new Set(stats.map(s => s.lab))];

            labs.forEach(lab => {
                const labStats = stats.filter(s => s.lab === lab);
                datasets.push({
                    label: lab,
                    data: labStats.map(s => ({
                        x: s.avgDuration,
                        y: s.scorePct,
                        label: s.name,
                        modelKey: s.model
                    })),
                    backgroundColor: LAB_COLORS[lab] || LAB_COLORS.default,
                    pointRadius: 8,
                    pointHoverRadius: 12
                });
            });

            const ctx = document.getElementById('speed-chart').getContext('2d');
            speedChart = new Chart(ctx, {
                type: 'scatter',
                data: { datasets },
                options: {
                    responsive: true,
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            const el = elements[0];
                            const modelKey = speedChart.data.datasets[el.datasetIndex].data[el.index].modelKey;
                            showModelCard(modelKey);
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: 'Score vs Gemiddelde Tijd per Prompt',
                            color: '#fff',
                            font: { size: 18 }
                        },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    const p = ctx.raw;
                                    return `${p.label}: ${p.y.toFixed(1)}% score, ${p.x.toFixed(1)}s (klik voor details)`;
                                }
                            }
                        },
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Gemiddelde tijd (seconden)', color: '#aaa' },
                            ticks: { color: '#aaa' },
                            grid: { color: '#333' }
                        },
                        y: {
                            title: { display: true, text: 'Score (%)', color: '#aaa' },
                            ticks: { color: '#aaa' },
                            grid: { color: '#333' }
                        }
                    }
                }
            });

            renderLegend('speed-legend', labs);
        }

        function createPriceChart() {
            const stats = getModelStats().filter(m => m.outputPrice !== null && m.outputPrice !== undefined);
            const datasets = [];
            const labs = [...new Set(stats.map(s => s.lab))];

            labs.forEach(lab => {
                const labStats = stats.filter(s => s.lab === lab);
                datasets.push({
                    label: lab,
                    data: labStats.map(s => ({
                        x: s.outputPrice,
                        y: s.scorePct,
                        label: s.name,
                        modelKey: s.model
                    })),
                    backgroundColor: LAB_COLORS[lab] || LAB_COLORS.default,
                    pointRadius: 8,
                    pointHoverRadius: 12
                });
            });

            const ctx = document.getElementById('price-chart').getContext('2d');
            priceChart = new Chart(ctx, {
                type: 'scatter',
                data: { datasets },
                options: {
                    responsive: true,
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            const el = elements[0];
                            const modelKey = priceChart.data.datasets[el.datasetIndex].data[el.index].modelKey;
                            showModelCard(modelKey);
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: 'Score vs Output Token Prijs',
                            color: '#fff',
                            font: { size: 18 }
                        },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    const p = ctx.raw;
                                    return `${p.label}: ${p.y.toFixed(1)}% score, $${p.x}/M tokens (klik voor details)`;
                                }
                            }
                        },
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Output prijs ($/M tokens)', color: '#aaa' },
                            ticks: { color: '#aaa' },
                            grid: { color: '#333' }
                        },
                        y: {
                            title: { display: true, text: 'Score (%)', color: '#aaa' },
                            ticks: { color: '#aaa' },
                            grid: { color: '#333' },
                            min: 0
                        }
                    }
                }
            });

            renderLegend('price-legend', labs);
        }

        function renderLegend(containerId, labs) {
            const container = document.getElementById(containerId);
            container.innerHTML = labs.map(lab => `
                <div class="legend-item">
                    <div class="legend-color" style="background: ${LAB_COLORS[lab] || LAB_COLORS.default}"></div>
                    <span>${lab}</span>
                </div>
            `).join('');
        }

        function onVisionToggle() {
            includeVision = document.getElementById('include-vision').checked;
            if (speedChart) { speedChart.destroy(); speedChart = null; }
            if (priceChart) { priceChart.destroy(); priceChart = null; }
            renderTable();
            if (currentModelKey) renderModelCard(currentModelKey);
            const activeTab = document.querySelector('.tab-content.active').id;
            if (activeTab === 'speed') createSpeedChart();
            if (activeTab === 'price') createPriceChart();
        }

        function getFilteredTests() {
            const availableTests = new Set(resultsData.map(r => r.test_name));
            // Use testOrder from prompts.toml, only include tests that exist in results
            let tests = testOrder.filter(t => availableTests.has(t));
            // Add any tests not in testOrder at the end
            availableTests.forEach(t => {
                if (!testOrder.includes(t)) tests.push(t);
            });
            if (!includeVision) {
                tests = tests.filter(t => !VISION_TESTS.includes(t));
            }
            return tests;
        }

        loadData();
    </script>
</body>
</html>
