<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardprompts - Model Benchmark Visualisatie</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }
        h2 {
            margin-bottom: 16px;
            color: #fff;
        }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
        }
        .tab {
            padding: 12px 24px;
            background: #2a2a4a;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            border-radius: 8px 8px 0 0;
            transition: all 0.2s;
        }
        .tab:hover {
            background: #3a3a5a;
            color: #fff;
        }
        .tab.active {
            background: #4a4a7a;
            color: #fff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: center;
            min-width: 90px;
        }
        th {
            background: #2a2a4a;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        th.model-header {
            position: sticky;
            left: 0;
            z-index: 20;
            background: #3a3a5a;
        }
        th.score-header {
            background: #3a4a5a;
        }
        td.model-cell {
            position: sticky;
            left: 0;
            background: #2a2a4a;
            font-weight: bold;
            text-align: left;
            white-space: nowrap;
            z-index: 5;
        }
        td.model-cell a {
            color: #6ea8fe;
            text-decoration: none;
        }
        td.model-cell a:hover {
            text-decoration: underline;
        }
        td.score-cell {
            background: #2a3a4a;
            font-weight: bold;
        }
        .score-pct {
            font-size: 16px;
        }
        .score-fraction {
            font-size: 11px;
            color: #AAA;
            margin-top: 2px;
        }
        .result-cell {
            position: relative;
            min-height: 40px;
        }
        .result-main {
            font-size: 18px;
            font-weight: bold;
        }
        .result-pass { color: #4caf50; }
        .result-fail { color: #f44336; }
        .result-partial { color: #ff9800; }
        .result-error { color: #9e9e9e; }
        .result-count {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: #666;
        }
        .result-time {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            color: #666;
        }
        .chart-container {
            background: #2a2a4a;
            border-radius: 12px;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        canvas {
            max-height: 600px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .outlier-note {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #3a3a5a;
            font-size: 13px;
            color: #aaa;
            line-height: 1.5;
        }
        .outlier-note:empty {
            display: none;
        }
        .outlier-note b {
            color: #ddd;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 16px;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .result-legend {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            justify-content: center;
            font-size: 12px;
        }
        .result-legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .vision-toggle {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 16px;
        }
        .vision-toggle:hover {
            color: #fff;
        }
        .vision-toggle input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }
        /* Model Card Styles */
        .model-card {
            max-width: 900px;
            margin: 0 auto;
        }
        .model-card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        .back-btn {
            background: #3a3a5a;
            border: none;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .back-btn:hover {
            background: #4a4a6a;
            color: #fff;
        }
        .model-card-title {
            font-size: 24px;
            color: #fff;
        }
        .model-card-lab {
            color: #888;
            font-size: 14px;
        }
        .card-section {
            background: #2a2a4a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-section h3 {
            margin-bottom: 16px;
            color: #aaa;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .spec-item {
            background: #1a1a2e;
            padding: 16px;
            border-radius: 8px;
        }
        .spec-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .spec-value {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        .results-table {
            width: 100%;
        }
        .results-table th {
            text-align: left;
            padding: 12px;
            background: #1a1a2e;
        }
        .results-table td {
            padding: 12px;
            border-bottom: 1px solid #333;
        }
    </style>
</head>
<body>
    <h1>Hardprompts Benchmark Resultaten</h1>

    <div class="tabs">
        <button class="tab active" onclick="showTab('table')">Tabel</button>
        <button class="tab" onclick="showTab('speed')">Score vs Snelheid</button>
        <button class="tab" onclick="showTab('price')">Score vs Kosten</button>
        <label class="vision-toggle">
            <input type="checkbox" id="include-vision" checked onchange="onVisionToggle()">
            <span>Include vision</span>
        </label>
    </div>

    <div id="table" class="tab-content active">
        <div class="result-legend">
            <span><strong class="result-pass">&#10003;</strong> = Correct</span>
            <span><strong class="result-fail">X</strong> = Fout</span>
            <span><strong class="result-partial">3</strong> = Deels correct</span>
            <span><strong class="result-error">T/R/B/E/G/I/N</strong> = Timeout/Rate limit/Bad request/Error/General error/Import/Not implemented</span>
        </div>
        <div class="table-container">
            <div class="loading" id="table-loading">Data laden...</div>
            <table id="results-table" style="display: none;"></table>
        </div>
    </div>

    <div id="speed" class="tab-content">
        <div class="chart-container">
            <canvas id="speed-chart"></canvas>
            <div class="legend" id="speed-legend"></div>
            <div class="outlier-note" id="speed-note"></div>
        </div>
    </div>

    <div id="price" class="tab-content">
        <div class="chart-container">
            <canvas id="price-chart"></canvas>
            <div class="legend" id="price-legend"></div>
            <div class="outlier-note" id="price-note"></div>
        </div>
    </div>

    <div id="model-card" class="tab-content">
        <div class="model-card" id="model-card-content"></div>
    </div>

    <script>
        let resultsData = [];
        let modelsData = {};
        let aggregatedData = {};
        let speedChart = null;
        let priceChart = null;
        let includeVision = true;
        let currentModelKey = null;

        const VISION_TESTS = ['BALKON1', 'TERRAS2', 'TERRAS3', 'VERSCHILLEN1', 'VERSCHILLEN2'];
        let testOrder = [];
        let testMaxScores = {};
        let modelOrder = [];

        // Embedded data (will be filled by output.py for standalone use)
        const EMBEDDED_DATA = {
            prompts: null,
            models_yaml: null,
            results: null,
            models: null
        };

        const LAB_COLORS = {
            'OpenAI': '#10a37f',
            'Anthropic': '#d4a574',
            'Google': '#4285f4',
            'Deepseek': '#6366f1',
            'Perplexity': '#22d3ee',
            'xAI': '#ef4444',
            'Moonshot': '#ec4899',
            'MiniMax': '#f97316',
            'default': '#888888'
        };

        function showTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            const tabBtn = document.querySelector(`[onclick="showTab('${tabId}')"]`);
            if (tabBtn) tabBtn.classList.add('active');
            document.getElementById(tabId).classList.add('active');

            if (tabId === 'speed' && !speedChart) createSpeedChart();
            if (tabId === 'price' && !priceChart) createPriceChart();
        }

        function showModelCard(modelKey) {
            currentModelKey = modelKey;
            renderModelCard(modelKey);

            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('model-card').classList.add('active');
        }

        function renderModelCard(modelKey) {
            const modelInfo = modelsData[modelKey] || {};
            const tests = getFilteredTests();

            // Calculate model stats
            let score = 0, maxScore = 0, totalDuration = 0, durationCount = 0;
            const testResults = [];

            tests.forEach(test => {
                const key = `${modelKey}|${test}`;
                const agg = aggregatedData[key];
                if (agg) {
                    const testMax = testMaxScores[test] || 1;
                    maxScore += agg.count * testMax;
                    let testScore = 0;
                    agg.results.forEach(r => {
                        if (r === '√') { score += testMax; testScore += testMax; }
                        else if (/^\d+$/.test(r)) { score += parseInt(r); testScore += parseInt(r); }
                    });
                    if (agg.avgDuration !== null) {
                        totalDuration += agg.avgDuration * agg.durations.length;
                        durationCount += agg.durations.length;
                    }
                    testResults.push({
                        name: test,
                        result: agg.displayResult,
                        count: agg.count,
                        avgDuration: agg.avgDuration,
                        score: testScore
                    });
                }
            });

            const avgDuration = durationCount > 0 ? totalDuration / durationCount : null;
            const scorePct = maxScore > 0 ? Math.round(100 * score / maxScore) : 0;

            const formatPrice = (p) => p !== null && p !== undefined ? `$${p}` : '-';
            const formatNum = (n) => n !== null && n !== undefined ? n.toLocaleString() : '-';

            let html = `
                <div class="model-card-header">
                    <button class="back-btn" onclick="showTab('table')">&larr; Terug</button>
                    <div>
                        <div class="model-card-title">${modelKey}</div>
                        <div class="model-card-lab">${modelInfo.lab || 'Unknown'}</div>
                    </div>
                </div>

                <div class="card-section">
                    <h3>Specificaties</h3>
                    <div class="specs-grid">
                        <div class="spec-item">
                            <div class="spec-label">Context Length</div>
                            <div class="spec-value">${formatNum(modelInfo.context_length)}</div>
                        </div>
                        <div class="spec-item">
                            <div class="spec-label">Max Output</div>
                            <div class="spec-value">${formatNum(modelInfo.max_output)}</div>
                        </div>
                        <div class="spec-item">
                            <div class="spec-label">Modality</div>
                            <div class="spec-value">${modelInfo.modality || '-'}</div>
                        </div>
                        <div class="spec-item">
                            <div class="spec-label">Vision Support</div>
                            <div class="spec-value">${modelInfo.supports_images ? 'Ja' : 'Nee'}</div>
                        </div>
                    </div>
                </div>

                <div class="card-section">
                    <h3>Prijzen (per miljoen tokens)</h3>
                    <div class="specs-grid">
                        <div class="spec-item">
                            <div class="spec-label">Input</div>
                            <div class="spec-value">${formatPrice(modelInfo.input_price)}</div>
                        </div>
                        <div class="spec-item">
                            <div class="spec-label">Output</div>
                            <div class="spec-value">${formatPrice(modelInfo.output_price)}</div>
                        </div>
                    </div>
                </div>

                <div class="card-section">
                    <h3>Benchmark Resultaten</h3>
                    <div class="specs-grid" style="margin-bottom: 20px;">
                        <div class="spec-item">
                            <div class="spec-label">Totaal Score</div>
                            <div class="spec-value">${score}/${maxScore} (${scorePct}%)</div>
                        </div>
                        <div class="spec-item">
                            <div class="spec-label">Gem. Tijd</div>
                            <div class="spec-value">${avgDuration !== null ? avgDuration.toFixed(1) + 's' : '-'}</div>
                        </div>
                    </div>
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>Test</th>
                                <th>Resultaat</th>
                                <th>Runs</th>
                                <th>Gem. Tijd</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${testResults.map(t => {
                                let resultClass = 'result-error';
                                let displayText = t.result;
                                if (t.result === '√') {
                                    resultClass = 'result-pass';
                                    displayText = '&#10003;';
                                } else if (t.result === 'X') {
                                    resultClass = 'result-fail';
                                } else if (/^\d+$/.test(t.result)) {
                                    const num = parseInt(t.result);
                                    if (num === t.count) {
                                        resultClass = 'result-pass';
                                        displayText = '&#10003;';
                                    } else if (num > 0) {
                                        resultClass = 'result-partial';
                                    } else {
                                        resultClass = 'result-fail';
                                    }
                                }
                                return `<tr>
                                    <td>${t.name}</td>
                                    <td><span class="${resultClass}">${displayText}</span></td>
                                    <td>${t.count}x</td>
                                    <td>${t.avgDuration !== null ? t.avgDuration.toFixed(1) + 's' : '-'}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            document.getElementById('model-card-content').innerHTML = html;
        }

        async function loadData() {
            try {
                let promptsText, modelsYamlText, resultsText, modelsText;

                // Check if we have embedded data (for file:// protocol)
                if (EMBEDDED_DATA.prompts && EMBEDDED_DATA.results) {
                    promptsText = EMBEDDED_DATA.prompts;
                    modelsYamlText = EMBEDDED_DATA.models_yaml;
                    resultsText = EMBEDDED_DATA.results;
                    modelsText = EMBEDDED_DATA.models;
                } else {
                    // Fetch data from files (for http:// protocol)
                    const promptsResponse = await fetch('data/prompts.toml');
                    promptsText = await promptsResponse.text();

                    const modelsYamlResponse = await fetch('data/models.yaml');
                    modelsYamlText = await modelsYamlResponse.text();

                    const resultsResponse = await fetch('data/results.jsonl');
                    resultsText = await resultsResponse.text();

                    const modelsResponse = await fetch('data/models.jsonl');
                    modelsText = await modelsResponse.text();
                }

                // Extract section names [NAME] in order
                testOrder = [...promptsText.matchAll(/^\[([A-Z0-9_]+)\]/gm)].map(m => m[1]);

                // Extract max_score per test section (defaults to 1)
                testMaxScores = {};
                const sectionMatches = [...promptsText.matchAll(/^\[([A-Z0-9_]+)\]/gm)];
                for (let i = 0; i < sectionMatches.length; i++) {
                    const start = sectionMatches[i].index + sectionMatches[i][0].length;
                    const end = i + 1 < sectionMatches.length ? sectionMatches[i + 1].index : promptsText.length;
                    const body = promptsText.slice(start, end);
                    const maxMatch = body.match(/^max_score\s*=\s*(\d+)/m);
                    if (maxMatch) testMaxScores[sectionMatches[i][1]] = parseInt(maxMatch[1]);
                }

                // Extract model names (lines starting with "  - " that are not comments)
                modelOrder = [...modelsYamlText.matchAll(/^\s+-\s+([^#\n]+)/gm)]
                    .map(m => m[1].trim())
                    .filter(m => m);

                resultsData = resultsText.trim().split('\n')
                    .filter(line => line.trim())
                    .map(line => JSON.parse(line));

                modelsText.trim().split('\n')
                    .filter(line => line.trim())
                    .map(line => JSON.parse(line))
                    .forEach(m => modelsData[m.key] = m);

                processData();
                renderTable();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('table-loading').textContent = 'Fout bij laden: ' + error.message;
            }
        }

        // Result codes for a run that produced no answer. justai reports the tokens of a call
        // that was billed before it failed, so one of these *without* a token count means
        // nothing was billed at all: no spend, rather than missing data.
        const ERROR_CODES = new Set(['T', 'R', 'B', 'E', 'G', 'N', 'I']);

        // Dollars for one run. Null when the run never completed or the model has no price,
        // and for every record written before hardprompts logged token counts.
        function recordCost(r) {
            const info = modelsData[r.model];
            if (!info || r.tokens_in == null || r.tokens_out == null) return null;
            if (info.input_price == null || info.output_price == null) return null;
            return (r.tokens_in * info.input_price + r.tokens_out * info.output_price) / 1e6;
        }

        function processData() {
            aggregatedData = {};

            resultsData.forEach(r => {
                const key = `${r.model}|${r.test_name}`;
                if (!aggregatedData[key]) {
                    aggregatedData[key] = {
                        model: r.model,
                        test_name: r.test_name,
                        results: [],
                        durations: [],
                        costs: [],
                        costUnknown: false
                    };
                }
                aggregatedData[key].results.push(r.result);
                if (r.duration) aggregatedData[key].durations.push(r.duration);
                const cost = recordCost(r);
                if (cost !== null) aggregatedData[key].costs.push(cost);
                // An answered run without a token count predates token logging, so what it
                // cost is genuinely unknown. Counting it as zero would flatter the model.
                else if (!ERROR_CODES.has(r.result)) aggregatedData[key].costUnknown = true;
            });

            Object.values(aggregatedData).forEach(agg => {
                const allSame = agg.results.every(r => r === agg.results[0]);
                if (allSame) {
                    agg.displayResult = agg.results[0];
                } else {
                    let score = 0;
                    agg.results.forEach(r => {
                        if (r === '√') score++;
                        else if (/^\d+$/.test(r)) score += parseInt(r);
                    });
                    const avg = score / agg.results.length;
                    agg.displayResult = avg % 1 === 0 ? String(avg) : avg.toFixed(1);
                }

                agg.count = agg.results.length;
                agg.avgDuration = agg.durations.length > 0
                    ? agg.durations.reduce((a, b) => a + b, 0) / agg.durations.length
                    : null;
                agg.avgCost = agg.costs.length > 0
                    ? agg.costs.reduce((a, b) => a + b, 0) / agg.costs.length
                    : null;
            });
        }

        function renderTable() {
            const allModels = [...new Set(resultsData.map(r => r.model))];
            const tests = getFilteredTests();

            // Only include models that are in models.yaml, sorted by their order
            const models = modelOrder.filter(m => allModels.includes(m));

            const modelScores = {};
            models.forEach(model => {
                let score = 0, maxScore = 0;
                tests.forEach(test => {
                    const key = `${model}|${test}`;
                    const agg = aggregatedData[key];
                    if (agg) {
                        const testMax = testMaxScores[test] || 1;
                        maxScore += agg.count * testMax;
                        agg.results.forEach(r => {
                            if (r === '√') score += testMax;
                            else if (/^\d+$/.test(r)) score += parseInt(r);
                        });
                    }
                });
                modelScores[model] = { score, maxScore };
            });

            let html = '<thead><tr>';
            html += '<th class="model-header">Model</th>';
            html += '<th class="score-header">Score</th>';
            tests.forEach(test => {
                html += `<th>${test}</th>`;
            });
            html += '</tr></thead><tbody>';

            models.forEach(model => {
                html += '<tr>';
                const modelInfo = modelsData[model];
                const titleName = modelInfo ? modelInfo.name : model;
                html += `<td class="model-cell"><a href="#" onclick="showModelCard('${model}'); return false;" title="${titleName}">${model}</a></td>`;

                const { score, maxScore } = modelScores[model];
                const pct = maxScore > 0 ? Math.round(100 * score / maxScore) : 0;
                html += `<td class="score-cell">
                    <div class="score-pct">${pct}%</div>
                    <div class="score-fraction">${score}/${maxScore}</div>
                </td>`;

                tests.forEach(test => {
                    const key = `${model}|${test}`;
                    const agg = aggregatedData[key];

                    if (!agg) {
                        html += '<td class="result-cell">-</td>';
                        return;
                    }

                    let resultClass = 'result-error';
                    let displayText = agg.displayResult;

                    if (agg.displayResult === '√') {
                        resultClass = 'result-pass';
                        displayText = '&#10003;';
                    } else if (agg.displayResult === 'X') {
                        resultClass = 'result-fail';
                    } else if (/^\d+(\.\d+)?$/.test(agg.displayResult)) {
                        const num = parseFloat(agg.displayResult);
                        if (num > 0) {
                            resultClass = 'result-partial';
                        } else {
                            resultClass = 'result-fail';
                        }
                    }

                    const timeStr = agg.avgDuration !== null ? Math.round(agg.avgDuration) + 's' : '-';

                    html += `<td class="result-cell">
                        <span class="result-count">${agg.count}x</span>
                        <span class="result-main ${resultClass}">${displayText}</span>
                        <span class="result-time">${timeStr}</span>
                    </td>`;
                });

                html += '</tr>';
            });

            html += '</tbody>';

            document.getElementById('results-table').innerHTML = html;
            document.getElementById('results-table').style.display = 'table';
            document.getElementById('table-loading').style.display = 'none';
        }

        function getModelStats() {
            const allModels = [...new Set(resultsData.map(r => r.model))];
            // Only include models that are in models.yaml
            const models = modelOrder.filter(m => allModels.includes(m));
            const tests = getFilteredTests();

            return models.map(model => {
                let score = 0, maxScore = 0, totalDuration = 0, durationCount = 0;
                // One prompt with unknown spend means we can only price a part of the benchmark,
                // and a partial sum next to complete ones would read as "this model is cheaper".
                let benchmarkCost = 0, costComplete = true, pricedTests = 0;

                tests.forEach(test => {
                    const key = `${model}|${test}`;
                    const agg = aggregatedData[key];
                    if (agg) {
                        const testMax = testMaxScores[test] || 1;
                        maxScore += agg.count * testMax;
                        agg.results.forEach(r => {
                            if (r === '√') score += testMax;
                            else if (/^\d+$/.test(r)) score += parseInt(r);
                        });
                        if (agg.avgDuration !== null) {
                            totalDuration += agg.avgDuration * agg.durations.length;
                            durationCount += agg.durations.length;
                        }
                    }
                    // A prompt on which every run failed adds nothing: no answer, no spend.
                    if (agg && agg.avgCost !== null) { benchmarkCost += agg.avgCost; pricedTests++; }
                    else if (!agg || agg.costUnknown) costComplete = false;
                });

                const modelInfo = modelsData[model] || {};
                const avgDuration = durationCount > 0 ? totalDuration / durationCount : null;
                const scorePct = maxScore > 0 ? (score / maxScore) * 100 : 0;

                return {
                    model,
                    name: model,
                    lab: modelInfo.lab || 'default',
                    score,
                    maxScore,
                    scorePct,
                    avgDuration,
                    outputPrice: modelInfo.output_price,
                    // pricedTests guards the model that failed every single prompt: complete,
                    // free, and worthless, which would otherwise plot at the origin.
                    benchmarkCost: costComplete && pricedTests > 0 ? benchmarkCost : null
                };
            }).filter(m => m.maxScore > 0);
        }

        // Tukey's "far out" fence: Q3 + 3*IQR. The usual k=1.5 fence is too eager here -- with
        // ~20 models it also flags the merely-expensive ones, which belong on the chart.
        function splitOutliers(stats, getX) {
            const xs = stats.map(getX).sort((a, b) => a - b);
            if (xs.length < 4) return { kept: stats, outliers: [] };
            const q = p => {
                const pos = (xs.length - 1) * p, lo = Math.floor(pos);
                return xs[lo] + (xs[Math.min(lo + 1, xs.length - 1)] - xs[lo]) * (pos - lo);
            };
            const iqr = q(0.75) - q(0.25);
            if (iqr === 0) return { kept: stats, outliers: [] };
            const fence = q(0.75) + 3 * iqr;
            return {
                kept: stats.filter(s => getX(s) <= fence),
                outliers: stats.filter(s => getX(s) > fence)
            };
        }

        function renderOutlierNote(containerId, outliers, describe) {
            const el = document.getElementById(containerId);
            if (!outliers.length) { el.innerHTML = ''; return; }
            const items = outliers
                .sort((a, b) => b.scorePct - a.scorePct)
                .map(s => `<b>${s.name}</b> (${describe(s)}, ${s.scorePct.toFixed(1)}% score)`)
                .join(', ');
            const label = outliers.length === 1 ? 'uitschieter' : 'uitschieters';
            el.innerHTML = `Buiten beeld gelaten als ${label}, omdat de schaal er anders `
                + `onleesbaar van wordt: ${items}.`;
        }

        function createSpeedChart() {
            const all = getModelStats().filter(m => m.avgDuration !== null);
            const { kept: stats, outliers } = splitOutliers(all, s => s.avgDuration);
            const datasets = [];
            const labs = [...new Set(stats.map(s => s.lab))];

            labs.forEach(lab => {
                const labStats = stats.filter(s => s.lab === lab);
                datasets.push({
                    label: lab,
                    data: labStats.map(s => ({
                        x: s.avgDuration,
                        y: s.scorePct,
                        label: s.name,
                        modelKey: s.model
                    })),
                    backgroundColor: LAB_COLORS[lab] || LAB_COLORS.default,
                    pointRadius: 8,
                    pointHoverRadius: 12
                });
            });

            const ctx = document.getElementById('speed-chart').getContext('2d');
            speedChart = new Chart(ctx, {
                type: 'scatter',
                data: { datasets },
                options: {
                    responsive: true,
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            const el = elements[0];
                            const modelKey = speedChart.data.datasets[el.datasetIndex].data[el.index].modelKey;
                            showModelCard(modelKey);
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: 'Score vs Gemiddelde Tijd per Prompt',
                            color: '#fff',
                            font: { size: 18 }
                        },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    const p = ctx.raw;
                                    return `${p.label}: ${p.y.toFixed(1)}% score, ${p.x.toFixed(1)}s (klik voor details)`;
                                }
                            }
                        },
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Gemiddelde tijd (seconden)', color: '#aaa' },
                            ticks: { color: '#aaa' },
                            grid: { color: '#333' }
                        },
                        y: {
                            title: { display: true, text: 'Score (%)', color: '#aaa' },
                            ticks: { color: '#aaa' },
                            grid: { color: '#333' }
                        }
                    }
                }
            });

            renderLegend('speed-legend', labs);
            renderOutlierNote('speed-note', outliers, s => `${s.avgDuration.toFixed(1)}s gemiddeld`);
        }

        function createPriceChart() {
            const all = getModelStats();
            const priced = all.filter(m => m.benchmarkCost !== null);
            const unpriced = all.filter(m => m.benchmarkCost === null);
            const { kept: stats, outliers } = splitOutliers(priced, s => s.benchmarkCost);
            const datasets = [];
            const labs = [...new Set(stats.map(s => s.lab))];

            labs.forEach(lab => {
                const labStats = stats.filter(s => s.lab === lab);
                datasets.push({
                    label: lab,
                    data: labStats.map(s => ({
                        x: s.benchmarkCost,
                        y: s.scorePct,
                        label: s.name,
                        modelKey: s.model
                    })),
                    backgroundColor: LAB_COLORS[lab] || LAB_COLORS.default,
                    pointRadius: 8,
                    pointHoverRadius: 12
                });
            });

            const ctx = document.getElementById('price-chart').getContext('2d');
            priceChart = new Chart(ctx, {
                type: 'scatter',
                data: { datasets },
                options: {
                    responsive: true,
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            const el = elements[0];
                            const modelKey = priceChart.data.datasets[el.datasetIndex].data[el.index].modelKey;
                            showModelCard(modelKey);
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: 'Score vs Kosten van de hele benchmark',
                            color: '#fff',
                            font: { size: 18 }
                        },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    const p = ctx.raw;
                                    return `${p.label}: ${p.y.toFixed(1)}% score, $${p.x.toFixed(3)} per run (klik voor details)`;
                                }
                            }
                        },
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Kosten van één volledige benchmarkrun ($)', color: '#aaa' },
                            ticks: { color: '#aaa' },
                            grid: { color: '#333' }
                        },
                        y: {
                            title: { display: true, text: 'Score (%)', color: '#aaa' },
                            ticks: { color: '#aaa' },
                            grid: { color: '#333' },
                            min: 0
                        }
                    }
                }
            });

            renderLegend('price-legend', labs);
            renderOutlierNote('price-note', outliers, s => `$${s.benchmarkCost.toFixed(2)} per run`);
            if (unpriced.length) {
                const names = unpriced.map(s => `<b>${s.name}</b>`).join(', ');
                document.getElementById('price-note').innerHTML +=
                    `<div>Nog geen kostenpunt voor ${names}: van minstens één prompt is onbekend ` +
                    `wat de run kostte, omdat het resultaat dateert van voor het loggen van tokens ` +
                    `of omdat er nooit een antwoord kwam. Eén extra pass (<code>-n=2</code>) haalt ` +
                    `ze erbij.</div>`;
            }
        }

        function renderLegend(containerId, labs) {
            const container = document.getElementById(containerId);
            container.innerHTML = labs.map(lab => `
                <div class="legend-item">
                    <div class="legend-color" style="background: ${LAB_COLORS[lab] || LAB_COLORS.default}"></div>
                    <span>${lab}</span>
                </div>
            `).join('');
        }

        function onVisionToggle() {
            includeVision = document.getElementById('include-vision').checked;
            if (speedChart) { speedChart.destroy(); speedChart = null; }
            if (priceChart) { priceChart.destroy(); priceChart = null; }
            renderTable();
            if (currentModelKey) renderModelCard(currentModelKey);
            const activeTab = document.querySelector('.tab-content.active').id;
            if (activeTab === 'speed') createSpeedChart();
            if (activeTab === 'price') createPriceChart();
        }

        function getFilteredTests() {
            const availableTests = new Set(resultsData.map(r => r.test_name));
            // Use testOrder from prompts.toml, only include tests that exist in results
            let tests = testOrder.filter(t => availableTests.has(t));
            // Add any tests not in testOrder at the end
            availableTests.forEach(t => {
                if (!testOrder.includes(t)) tests.push(t);
            });
            if (!includeVision) {
                tests = tests.filter(t => !VISION_TESTS.includes(t));
            }
            return tests;
        }

        loadData();
    </script>
</body>
